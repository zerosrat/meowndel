</style></head><body><main><header><div><small>MEOWNDEL · 3D COAT STUDY</small><h1>花色与白斑，一起看看</h1><p>11 种花色共享 5 个身体；纯黑和狸花可试五档白斑。</p></div><a href="coat-switcher.html">原花色册 →</a></header><div class="layout"><section><div id="stage" class="portrait"></div><nav class="angles"><button data-angle="0">正面</button><button data-angle="1.5707963267948966">侧面</button><button data-angle="3.141592653589793">背面</button></nav><p id="status" role="status"></p><button id="retry" hidden>重试</button><details><summary>查看加载记录</summary><p id="stats"></p><p class="note">文件大小不等于显存或网络流量；切到原版会额外读取原模型。</p></details></section><section><h2>选一套花色</h2><div class="choices" id="coats"></div><div class="choices"><button id="shared" aria-pressed="true">共享版</button><button id="original" aria-pressed="false">原版对照</button></div><div class="trial"><h2>白斑小试验</h2><p class="note">先选纯黑或狸花。白斑是同一身体上的示意预设，不是精确遗传面积，也不是全白猫。</p><div class="choices"><button id="try-black">用纯黑试</button><button id="try-tabby">用狸花试</button></div><div class="choices" id="white-levels"></div><p id="white-note" class="note"></p></div><p class="note">验收重点：共享版是否保持原样；白斑边缘、脸部和背面是否自然。其余花色仍保留原贴图，不叠加白斑。</p></section></div><footer>独立验证页 · 短毛田园猫 · 拖动旋转，滚轮或双指缩放。长毛与正式页面尚未接入。</footer></main><script type="module" src="grouped-coats.ts"></script></body></html>
