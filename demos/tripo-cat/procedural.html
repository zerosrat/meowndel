<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>喵德尔 · 3D 猫试作</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#403c34;font:15px system-ui,sans-serif}header{max-width:1100px;margin:auto;padding:26px 28px 0;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:6px 0}small{color:#86775f;letter-spacing:2px}a{color:#65754a}main{max-width:1100px;margin:auto;padding:16px 24px}#stage{height:70vh;min-height:380px;position:relative;border-radius:28px;background:radial-gradient(ellipse at 50% 45%,#fffdf6,#eee7d8);overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#status{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#827967;font-size:13px;pointer-events:none}nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}button{font:inherit;padding:10px 18px;border:1px solid #d8d0bd;border-radius:22px;background:#fffdf6;color:#514b3d;cursor:pointer}button[aria-pressed=true]{background:#677650;color:white}select{font:inherit;border:1px solid #d8d0bd;border-radius:12px;padding:8px;background:#fffdf6;color:inherit}label{display:flex;align-items:center;gap:8px}button:disabled{opacity:.45;cursor:wait}footer{text-align:center;color:#857b6c;font-size:13px;line-height:1.8}#error{color:#974f3d} @media(max-width:600px){header{padding:20px 20px 0}h1{font-size:19px}main{padding:16px 12px}#stage{height:65vh;min-height:320px}}
</style>
<header><div><small>MEOWNDEL · ART STUDY</small><h1>一只可以转过身的猫</h1></div><a href="/">看看现有 2D →</a></header>
<main><div id="stage"><canvas aria-label="可拖动旋转的田园猫"></canvas><div id="status" role="status">正在载入猫咪…</div></div><nav aria-label="模型版本"><button data-model="light" aria-pressed="true" disabled>轻量版</button><button data-model="original" aria-pressed="false" disabled>原始版对比</button></nav><nav aria-label="毛色试验"><button data-coat="original" aria-pressed="true" disabled>原始橘色</button><button data-coat="cream" aria-pressed="false" disabled>奶油色试验</button><button data-coat="brown" aria-pressed="false" disabled>棕色虎斑试验</button><button data-coat="tuxedo" aria-pressed="false" disabled>黑白</button><button data-coat="calico" aria-pressed="false" disabled>三花</button><button data-coat="layered" aria-pressed="false" disabled>分层虎斑</button></nav><nav aria-label="花纹控制"><label>白斑范围 <select id="white" aria-label="白斑范围" disabled><option value="0">无白</option><option value="1" selected>少量白</option><option value="2">扩展白斑</option><option value="3">大面积白</option></select></label><label><input type="checkbox" id="stripes" disabled> 叠加虎斑</label></nav><nav aria-label="查看角度"><button data-view="front" disabled>正面</button><button data-view="side" disabled>侧面</button><button data-view="back" disabled>背面</button><button id="rotate" aria-pressed="false" disabled>自动转动</button><button id="reset" disabled>恢复视角</button></nav><footer>拖动转动 · 滚轮或双指缩放<br>黑白、三花和分层虎斑支持独立调节白斑与条纹。<br>花纹为这只静态猫的连续分区样板，尚未接入遗传结果。<span id="error" role="alert"></span></footer></main>
<script type="module" src="./procedural-viewer.js"></script>
</html>
