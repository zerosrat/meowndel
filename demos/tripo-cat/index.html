<style>
*{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#403c34;font:15px system-ui,sans-serif}header{max-width:1100px;margin:auto;padding:26px 28px 0;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:6px 0}small{color:#86775f;letter-spacing:2px}a{color:#65754a}main{max-width:1100px;margin:auto;padding:16px 24px}#stage{height:64vh;min-height:380px;position:relative;border-radius:28px;background:radial-gradient(ellipse at 50% 45%,#fffdf6,#eee7d8);overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#status{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:95%;padding:5px 12px;border-radius:14px;background:#fffdf6dd;text-align:center;color:#827967;font-size:13px;pointer-events:none}nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}button{font:inherit;padding:10px 18px;border:1px solid #d8d0bd;border-radius:22px;background:#fffdf6;color:#514b3d;cursor:pointer}button[aria-pressed=true]{background:#677650;color:white}select{font:inherit;border:1px solid #d8d0bd;border-radius:12px;padding:8px;background:#fffdf6;color:inherit}label{display:flex;align-items:center;gap:8px}button:disabled{opacity:.45;cursor:wait}footer{text-align:center;color:#857b6c;font-size:13px;line-height:1.8}#error{color:#974f3d} @media(max-width:600px){header{padding:20px 20px 0}h1{font-size:19px}main{padding:16px 12px}#stage{height:57vh;min-height:320px}}
