</style><main><header><b>喵德尔 ✧</b><a href="four-layers.html">四品种分层新版 ↗</a><a href="flat.html">返回四品种小样 ↗</a></header><h1>同一只猫，六种花色。</h1><p>脸型和表情不变，只给毛色换个样子。</p><div class="layout"><section class="stage" id="stage"><canvas id="portrait" width="1000" height="1000" role="img" aria-label="猫咪花色预览"></canvas><span class="caption" id="caption">准备底稿…</span></section><aside><h2>01 / 选择花色</h2><div class="choices" id="coats"></div><h2>02 / 看看花色如何组成</h2><label><input type="checkbox" id="pattern" checked> 花纹</label><label><input type="checkbox" id="white" checked> 白斑</label><label><input type="checkbox" id="source"> 查看无花纹底稿</label><p class="small" id="description"></p><h2 style="margin-top:24px">03 / 展示背景</h2><div class="choices" id="background"><button aria-pressed="true" data-bg="">鼠尾草</button><button aria-pressed="false" data-bg="dark">深色</button><button aria-pressed="false" data-bg="check">透明格</button></div><a id="download" download="meowndel-cat.png">保存当前透明 PNG ↓</a></aside></div><div class="grid" id="grid" aria-label="六种花色对照"></div><p class="note small">本轮验证：一张中性底稿 + 底色 + 花纹 + 白斑。六只猫共用轮廓、五官与纸感纹理。中性底稿由已认可的田园猫插画转换，细节有少量变化；英短与原四品种小样继续保留。此处花色为美术实验，尚未接入遗传计算。</p><p id="status" role="status">正在生成六种花色…</p></main><script src="layers.js"></script></html>
